# ==============================================================================
# AI-Kube — Banc d'évaluation de l'agent de dépannage, v2 (chapitre C2)
# ==============================================================================
# VERSION 2 — mêmes dix pannes que la v1, avec deux défauts de la v1 corrigés :
#   1. noms neutres (svc-01 … svc-09, web-front) : le nom ne trahit plus la cause ;
#   2. aucune annotation : la cause n'est plus lisible avec « kubectl describe ».
# Valeurs réalistes (fast-ssd, disktype=nvme) au lieu de « …-inexistant ».
# La vérité terrain est UNIQUEMENT dans scripts/campaign_agent.py (BENCHES, EVIDENCE).
#
# USAGE
#   kubectl apply -f k8s/benchmark/agent-benchmark-v2.yaml
#   (attendre 3 minutes que les pannes se manifestent)
#   python3 scripts/campaign_agent.py --bench v2
#   kubectl delete namespace aikube-agent2
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aikube-agent2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-05
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-05}}
  template:
    metadata: {labels: {app: svc-05}}
    spec:
      containers:
        - name: app
          image: busybox:9.99
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-03
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-03}}
  template:
    metadata: {labels: {app: svc-03}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'démarrage de api-service v2.3'; sleep 2; echo 'FATAL: variable d environnement DATABASE_URL manquante' >&2; exit 1"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-07
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-07}}
  template:
    metadata: {labels: {app: svc-07}}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-c", "import time\nb = bytearray(100*1024*1024)\ntime.sleep(100000)"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 48Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-09
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-09}}
  template:
    metadata: {labels: {app: svc-09}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: "64", memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-06
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-06}}
  template:
    metadata: {labels: {app: svc-06}}
    spec:
      nodeSelector: {disktype: nvme}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-08
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-08}}
  template:
    metadata: {labels: {app: svc-08}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          envFrom: [{configMapRef: {name: agent-settings}}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-04
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-04}}
  template:
    metadata: {labels: {app: svc-04}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 8081}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: web-backend}}
  template:
    metadata: {labels: {app: web-backend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: web-front
  namespace: aikube-agent2
spec:
  selector: {app: web-backnd}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: aikube-agent2
spec:
  storageClassName: fast-ssd
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-01
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-01}}
  template:
    metadata: {labels: {app: svc-01}}
    spec:
      volumes: [{name: data, persistentVolumeClaim: {claimName: agent-data}}]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-02
  namespace: aikube-agent2
spec:
  replicas: 1
  selector: {matchLabels: {app: svc-02}}
  template:
    metadata: {labels: {app: svc-02}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
