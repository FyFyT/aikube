# ==============================================================================
# AI-Kube — Banc d'évaluation de l'agent de dépannage (chapitre C2)
# ==============================================================================
# Dix situations, chacune avec une cause unique et connue. La vérité terrain est
# portée par les annotations :
#   aikube.agent/cause     : cause racine, en clair
#   aikube.agent/question  : question posée à l'agent (neutre : ne donne pas la cause)
# Les mots-clés de notation automatique sont dans scripts/campaign_agent.py.
#
# USAGE
#   kubectl apply -f k8s/benchmark/agent-benchmark.yaml
#   (attendre 3 minutes que les pannes se manifestent)
#   python3 scripts/campaign_agent.py
#   kubectl delete namespace aikube-agent
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: aikube-agent
---
# 1 — image inexistante → ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-image
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "tag d'image inexistant (busybox:9.99-inexistant)"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-image}}
  template:
    metadata: {labels: {app: agent-image}}
    spec:
      containers:
        - name: app
          image: busybox:9.99-inexistant
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
# 2 — l'application s'arrête faute de variable de configuration → CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-crash
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "variable DATABASE_URL manquante, l'application s'arrête (exit 1)"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-crash}}
  template:
    metadata: {labels: {app: agent-crash}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'démarrage de api-service v2.3'; sleep 2; echo 'FATAL: variable d environnement DATABASE_URL manquante' >&2; exit 1"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
---
# 3 — limite mémoire trop basse → OOMKilled
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-oom
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "OOMKilled : l'application alloue ~100 Mio pour une limite de 48Mi"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-oom}}
  template:
    metadata: {labels: {app: agent-oom}}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python", "-c", "import time\nb = bytearray(100*1024*1024)\ntime.sleep(100000)"]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 48Mi}}
---
# 4 — demande de CPU impossible → Pending (Insufficient cpu)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-pending
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "request CPU de 64 cœurs, aucun nœud ne peut l'accueillir (Insufficient cpu)"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-pending}}
  template:
    metadata: {labels: {app: agent-pending}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: "64", memory: 16Mi}}
---
# 5 — nodeSelector sans nœud correspondant → Pending
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-selector
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "nodeSelector disktype=nvme-inexistant : aucun nœud ne porte cette étiquette"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-selector}}
  template:
    metadata: {labels: {app: agent-selector}}
    spec:
      nodeSelector: {disktype: nvme-inexistant}
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# 6 — ConfigMap référencée mais absente → CreateContainerConfigError
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-config
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "ConfigMap agent-settings référencée (envFrom) mais inexistante"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-config}}
  template:
    metadata: {labels: {app: agent-config}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          envFrom: [{configMapRef: {name: agent-settings}}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# 7 — sonde de disponibilité sur le mauvais port → jamais prêt
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-probe
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "readinessProbe sur le port 8081 alors que nginx écoute sur 80"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-probe}}
  template:
    metadata: {labels: {app: agent-probe}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 8081}, periodSeconds: 5}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
# 8 — Service dont le sélecteur ne correspond à aucun pod → aucun endpoint
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-backend
  namespace: aikube-agent
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-backend}}
  template:
    metadata: {labels: {app: agent-backend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: agent-svc
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "sélecteur app=agent-backnd (faute de frappe) : le Service n'a aucun endpoint"}
spec:
  selector: {app: agent-backnd}
  ports: [{port: 80, targetPort: 80}]
---
# 9 — PVC sur une StorageClass inexistante → pod Pending
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-data
  namespace: aikube-agent
spec:
  storageClassName: fast-ssd-inexistante
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-storage
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "PVC agent-data sur la StorageClass fast-ssd-inexistante : jamais lié, pod Pending"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-storage}}
  template:
    metadata: {labels: {app: agent-storage}}
    spec:
      volumes: [{name: data, persistentVolumeClaim: {claimName: agent-data}}]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          volumeMounts: [{name: data, mountPath: /data}]
          resources: {requests: {cpu: 10m, memory: 16Mi}}
---
# 10 — TÉMOIN : déploiement sain (l'agent ne doit pas inventer de panne)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-healthy
  namespace: aikube-agent
  annotations: {aikube.agent/cause: "aucune : déploiement sain"}
spec:
  replicas: 1
  selector: {matchLabels: {app: agent-healthy}}
  template:
    metadata: {labels: {app: agent-healthy}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "100000"]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 32Mi}}
